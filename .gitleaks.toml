# Documented gitleaks exception (same discipline as .trivyignore).
#
# pi-agent-ha/web/ttyd-index.html is the STOCK ttyd 1.7.7 page, vendored
# byte-for-byte (verified identical to the page the running container's
# ttyd binary serves). gitleaks' generic-api-key rule false-positives on
# its minified JS (content hashes, base64 favicon) — 3 findings on one
# line. Upstream github.com/tsl0922/ttyd is the source of record: if this
# file is ever hand-edited, re-review it before keeping the allowlist.
[allowlist]
description = "vendored stock ttyd 1.7.7 page (byte-identical upstream asset, minified-JS false positives)"
paths = ['''^pi-agent-ha/web/ttyd-index\\.html$''']
