# Documented gitleaks exception (same discipline as .trivyignore).
#
# pi-agent-ha/web/ttyd-index.html existed in history (1.9.0, commits
# 13a2314/269ace8/57b6ec5) as the stock ttyd 1.7.7 page, vendored byte-for-byte
# and patched (HA theme sync in 1.9.0; xterm theme neutralization/stripping in
# 1.9.2/1.9.3). It was REMOVED in 1.9.4 (stock ttyd page served again, matching
# the ecosystem). gitleaks' generic-api-key rule false-positives on the file's
# minified JS (content hashes, base64 favicon) as it exists in history.
# Keep this allowlist while those commits remain in history; upstream
# github.com/tsl0922/ttyd is the source of record for the bytes.
[allowlist]
description = "vendored stock ttyd 1.7.7 page (byte-identical upstream asset, minified-JS false positives)"
paths = ['''^pi-agent-ha/web/ttyd-index\.html$''']
