# Documented gitleaks exception (same discipline as .trivyignore).
#
# pi-agent-ha/web/ttyd-index.html is the STOCK ttyd 1.7.7 page, vendored
# byte-for-byte (verified identical to the page the running container's ttyd
# binary serves) and color-neutralized in 1.9.2 (3 byte-precise patches:
# xterm default bg/fg -> #000000/#ffffff, page frame -> #000). gitleaks'
# generic-api-key rule false-positives on its minified JS (content hashes,
# base64 favicon) — in history (commit 13a2314) and in the current file.
# Keep this allowlist while the vendored page exists; upstream
# github.com/tsl0922/ttyd is the source of record for the bytes.
[allowlist]
description = "vendored stock ttyd 1.7.7 page (byte-identical upstream asset, minified-JS false positives)"
paths = ['''^pi-agent-ha/web/ttyd-index\.html$''']
