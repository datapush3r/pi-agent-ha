---
name: "Pi Agent Terminal"
description: "Terminal interface for the pi coding agent (pi.dev). Web terminal via ttyd embedded in the HA dashboard, persistent tmux session, access to /config, and optional Home Assistant control via the built-in MCP server."
version: "1.3.0"
slug: "pi_agent_ha"
init: false

arch:
  - aarch64
  - amd64

url: "https://github.com/datapush3r/pi-agent-ha"

# Pre-built container image (built by .github/workflows/build-image.yaml and
# pushed to GHCR) — installing/updating pulls this instead of building locally.
image: "ghcr.io/datapush3r/pi-agent-ha"

# Web interface configuration (embedded in the HA sidebar via ingress)
ingress: true
ingress_port: 7680
panel_icon: mdi:console
panel_title: "Pi Agent Terminal"
panel_admin: true

# Add-on configuration options
# Cloud: provider/model/api_key apply to built-in providers (Anthropic, OpenAI, ...)
# Local: local_* generates models.json for OpenAI-compatible servers (Ollama, vLLM, ...)
# HA MCP: ha_mcp_token enables control of Home Assistant via its built-in MCP server.
#   Leave ha_mcp_token empty to disable. Set it to an HA long-lived access token
#   (Settings > your user > Security > Long-lived access tokens) to expose HA tools
#   (ha_tools / ha_call) to the pi agent. ha_mcp_url is the HA MCP endpoint
#   (http://homeassistant:8123/api/mcp is correct inside HAOS).
options:
  auto_launch_pi: true
  tmux_mouse: false
  provider: ""
  model: ""
  api_key: ""
  api_key_env: "ANTHROPIC_API_KEY"
  local_base_url: ""
  local_model: ""
  local_provider_name: "ninfer"
  local_api: "openai-completions"
  local_api_key: ""
  local_reasoning: true
  local_context_window: 240000
  local_max_tokens: 8192
  ha_mcp_url: "http://homeassistant:8123/api/mcp"
  ha_mcp_token: ""

schema:
  auto_launch_pi: bool?
  tmux_mouse: bool?
  provider: str?
  model: str?
  api_key: password?
  api_key_env: str?
  local_base_url: str?
  local_model: str?
  local_provider_name: str?
  local_api: str?
  local_api_key: password?
  local_reasoning: bool?
  local_context_window: int?
  local_max_tokens: int?
  ha_mcp_url: str?
  ha_mcp_token: password?

# Volume mappings for file access
map:
  - config:rw # pi opens in the HA config directory

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

# Service startup configuration
startup: services
