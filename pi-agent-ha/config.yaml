---
name: "Pi Agent Terminal"
description: "Terminal interface for the pi coding agent (pi.dev). Web terminal via ttyd embedded in the HA dashboard, persistent tmux session, access to /config, Home Assistant control via the ha-mcp MCP server, and the home-assistant-ai best-practices skill."
version: "1.9.5"
slug: "pi_agent_ha"
init: false

arch:
  - aarch64
  - amd64

url: "https://github.com/datapush3r/pi-agent-ha"

# Pre-built container image (built by .github/workflows/build-image.yaml and
# pushed to GHCR) — installing/updating pulls this instead of building locally.
image: "ghcr.io/datapush3r/pi-agent-ha"

# Web interface configuration (embedded in the HA sidebar via ingress)
ingress: true
ingress_port: 7680
panel_icon: mdi:console
panel_title: "Pi Agent Terminal"
panel_admin: true

# Add-on configuration options
# Cloud: provider/model/api_key apply to built-in providers (Anthropic, OpenAI, ...)
# Local: local_* generates models.json for OpenAI-compatible servers (Ollama, vLLM, ...)
# Packages: pi_packages is a comma-separated list of pi package specs
#   (npm: / git: / URL) installed at startup via pi's own installer.
# HA control: ha_mcp_url points pi at a Home Assistant MCP server.
#   Intended backend: the homeassistant-ai "Home Assistant MCP Server" app
#   (https://github.com/homeassistant-ai/ha-mcp) — full control, build and debug.
#   Install that app, then copy its MCP URL (shown in the app's Logs tab) into
#   ha_mcp_url to expose its tools (ha_tools / ha_call) to pi. Leave ha_mcp_url
#   empty to disable HA control. ha_mcp_token is an optional Bearer token, only
#   needed if the endpoint requires one (e.g. HA's built-in /api/mcp).
options:
  auto_launch_pi: true
  tmux_mouse: false
  provider: ""
  model: ""
  api_key: ""
  api_key_env: "ANTHROPIC_API_KEY"
  local_base_url: ""
  local_model: ""
  local_provider_name: "ninfer"
  local_api: "openai-completions"
  local_api_key: ""
  local_reasoning: true
  local_context_window: 240000
  local_max_tokens: 8192
  ha_mcp_url: ""
  ha_mcp_token: ""
  hide_ha_output: true
  pi_packages: ""
  ha_skills: true

schema:
  auto_launch_pi: bool?
  tmux_mouse: bool?
  provider: str?
  model: str?
  api_key: password?
  api_key_env: str?
  local_base_url: str?
  local_model: str?
  local_provider_name: str?
  local_api: str?
  local_api_key: password?
  local_reasoning: bool?
  local_context_window: int?
  local_max_tokens: int?
  ha_mcp_url: str?
  ha_mcp_token: password?
  hide_ha_output: bool?
  pi_packages: str?
  ha_skills: bool?

# Volume mappings for file access
map:
  - config:rw # pi opens in the HA config directory

# Volumes and startup. No Supervisor/HA/auth API access is declared
# deliberately — nothing in the add-on calls those APIs (least privilege).

# Service startup configuration
startup: services
